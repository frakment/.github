name: OSV-Scanner

on:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  osv:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@3c399db9dd6dd8106a27d280d53c55077d3f7cea
    with:
      scan-args: |-
        --lockfile=package-lock.json
        --format=sarif
        --output=osv.sarif
    permissions:
      contents: read
      actions: read
      security-events: write
