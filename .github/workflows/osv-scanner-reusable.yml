name: OSV-Scanner

on:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  osv:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@d3c1414ded37de590f207572e37a7d180f1d0ef7
    with:
      scan-args: |-
        --lockfile=package-lock.json
      results-file-name: osv.sarif
    permissions:
      contents: read
      actions: read
      security-events: write
