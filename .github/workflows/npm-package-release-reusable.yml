name: npm package release

on:
  workflow_call:
    secrets:
      token:
        required: true
      npm_token:
        required: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.11.0
      - run: npm ci
      - name: Configure npm publish token
        env:
          NPM_TOKEN: ${{ secrets.npm_token }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            printf 'NODE_AUTH_TOKEN=%s\n' "$NPM_TOKEN" >> "$GITHUB_ENV"
          fi
      - name: Create Release PR or Publish
        uses: changesets/action@6a0a831ff30acef54f2c6aa1cbbc1096b066edaf
        with:
          publish: npm run release
          version: npm run version:packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.token }}
          NPM_TOKEN: ${{ secrets.npm_token }}
          NPM_CONFIG_PROVENANCE: true
      - name: Ensure the npm package release exists
        if: always()
        env:
          GH_TOKEN: ${{ secrets.token }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          tag="${name}@${version}"
          on_npm=false
          for attempt in 1 2 3 4 5 6; do
            if npm view "$name@$version" version >/dev/null 2>&1; then
              on_npm=true
              break
            fi
            if [ "$attempt" -lt 6 ]; then
              echo "Attempt $attempt: $tag is not visible on npm yet; retrying in 10s..."
              sleep 10
            fi
          done
          if [ "$on_npm" = false ]; then
            echo "::error::Package $tag was not published or is not accessible."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            git tag -a "$tag" -m "$tag"
            git push origin "$tag"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --notes "Release $tag" --verify-tag --latest
          fi
