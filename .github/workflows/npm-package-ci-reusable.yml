name: npm package CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.pm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pm: [npm, pnpm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        if: matrix.pm == 'pnpm'
        with:
          version: 12.14.0
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: matrix.pm == 'npm'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: matrix.pm == 'pnpm'
        with:
          node-version: 22
      - name: Install (npm)
        if: matrix.pm == 'npm'
        run: npm ci
      - name: Install (pnpm)
        if: matrix.pm == 'pnpm'
        run: pnpm install --frozen-lockfile
      - name: Check (npm)
        if: matrix.pm == 'npm'
        run: npm run check --if-present
      - name: Check (pnpm)
        if: matrix.pm == 'pnpm'
        run: pnpm run --if-present check
      - name: Typecheck (npm)
        if: matrix.pm == 'npm'
        run: npm run typecheck --if-present
      - name: Typecheck (pnpm)
        if: matrix.pm == 'pnpm'
        run: pnpm run --if-present typecheck
      - name: Test (npm)
        if: matrix.pm == 'npm'
        run: npm run test --if-present
      - name: Test (pnpm)
        if: matrix.pm == 'pnpm'
        run: pnpm run --if-present test
      - run: ${{ matrix.pm }} pack --dry-run
      - name: Use Node.js 24 for npm signature audit
        if: matrix.pm == 'npm'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.3
      - run: npm audit signatures
        if: matrix.pm == 'npm'
